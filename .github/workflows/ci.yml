name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      # `.prettierrc` matches the width the tree is written at, so this gate is
      # cheap to keep green and stops the formatting from silently drifting again.
      - name: Check formatting
        run: pnpm format:check

      - name: Run build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # The Korean guide and its Word-openable mirror are hand-maintained, so a
      # heading added to one and not the other is caught here rather than by a
      # reader finding a section missing.
      - name: Check the Korean guide against its Word mirror
        run: pnpm docs:check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The smoke specs run against `next start`, so the app must be built first
      - name: Run build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
